<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>midiconvert — PDF / audio → MIDI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <!-- html-midi-player: <midi-player> + <midi-visualizer> (soundfont via CDN) -->
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.77,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
</head>
<body>
  <main class="card">
    <h1>midiconvert</h1>
    <p class="sub">Sheet-music <strong>PDF</strong> or an <strong>audio file</strong> → playable MIDI.</p>

    <!-- Upload -->
    <section id="upload">
      <label id="drop" for="file" class="dropzone">
        <input type="file" id="file" accept="application/pdf,.pdf,audio/*,.mp3,.wav,.flac,.m4a,.ogg" hidden />
        <span class="drop-icon">♪</span>
        <span class="drop-main">Drop a PDF or audio file here, or <u>browse</u></span>
        <span id="filename" class="drop-hint">No file selected</span>
        <span id="kind-badge" class="badge" hidden></span>
      </label>

      <details class="advanced">
        <summary>Advanced options</summary>

        <!-- PDF (sheet music) options -->
        <div class="opts" id="adv-pdf" hidden>
          <label>Voice GM program
            <input type="number" id="voice_program" min="0" max="127" value="53" />
          </label>
          <label>Piano GM program
            <input type="number" id="piano_program" min="0" max="127" value="0" />
          </label>
          <label class="check">
            <input type="checkbox" id="tempo_fix" checked />
            Auto-fix compound-meter tempo
          </label>
          <label class="check">
            <input type="checkbox" id="repair_rh" />
            Repair right-hand eighth-rests
          </label>
          <label>Force eighth-note BPM <span class="opt">(optional)</span>
            <input type="number" id="eighth_bpm" min="1" step="0.5" placeholder="from score" />
          </label>
        </div>

        <!-- Audio (transcription) options -->
        <div class="opts" id="adv-audio" hidden>
          <label>Onset sensitivity <span class="opt">(0–1)</span>
            <input type="number" id="onset_threshold" min="0" max="1" step="0.05" value="0.5" />
          </label>
          <label>Frame sensitivity <span class="opt">(0–1)</span>
            <input type="number" id="frame_threshold" min="0" max="1" step="0.05" value="0.3" />
          </label>
          <label>Melody low <span class="opt">(MIDI)</span>
            <input type="number" id="melody_min" min="0" max="127" value="55" />
          </label>
          <label>Melody high <span class="opt">(MIDI)</span>
            <input type="number" id="melody_max" min="0" max="127" value="84" />
          </label>
          <label>Min melody note <span class="opt">(ms)</span>
            <input type="number" id="melody_min_ms" min="0" step="10" value="120" />
          </label>
        </div>

        <p class="opt" id="adv-hint">Choose a file to see relevant options.</p>
      </details>

      <button id="convert" class="primary" disabled>Convert to MIDI</button>
    </section>

    <!-- Progress -->
    <section id="progress" hidden>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="step" class="step">Starting…</p>
    </section>

    <!-- Result -->
    <section id="result" hidden>
      <h2 id="result-title">Done</h2>
      <div id="player-toggle" class="toggle" hidden></div>
      <midi-player id="player" sound-font visualizer="#viz"></midi-player>
      <div id="readout" class="readout" aria-live="polite">
        <span class="readout-label">Now playing</span>
        <span id="readout-notes" class="readout-notes">—</span>
      </div>
      <midi-visualizer id="viz" type="piano-roll"></midi-visualizer>
      <div id="downloads" class="downloads"></div>
      <button id="again" class="ghost">Convert another</button>
      <p id="result-note" class="note"></p>
    </section>

    <!-- Error -->
    <section id="error" hidden>
      <h2>Conversion failed</h2>
      <pre id="error-msg"></pre>
      <button id="retry" class="ghost">Try again</button>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
